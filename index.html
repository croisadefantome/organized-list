<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Organized List</title>
  <meta name="description" content="A flexible, searchable personal catalog.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#14233b;--muted:#647188;--paper:#f4f7fb;--card:#ffffff;--line:#d6dce5;--accent:#b07a2a;--soft:#e8eef5}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}main{min-height:100vh;padding:42px 22px 64px}.shell{width:min(940px,100%);margin:0 auto}.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 2px 18px;border-bottom:2px solid var(--ink)}.eyebrow{margin:0 0 9px;font:500 .63rem/1 'IBM Plex Mono',monospace;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{margin:0;font:600 clamp(2.35rem,6vw,4rem)/.9 'Cormorant Garamond',serif;letter-spacing:-.035em}.head-meta{display:flex;align-items:center;gap:16px;font:500 .64rem 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}select{appearance:none;background:transparent;border:1px solid var(--ink);border-radius:3px;padding:8px 29px 8px 10px;color:var(--ink);font:500 .6rem 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}.intro{display:flex;flex-wrap:wrap;gap:8px 34px;padding:15px 3px 6px;color:#3e4b60;font-size:.82rem}.intro p{margin:0}.intro span{margin-right:8px;color:var(--muted);font:500 .58rem 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.tabs{display:flex;gap:5px;margin-top:24px;border-bottom:1px solid var(--ink)}.tabs button{margin-bottom:-1px;padding:10px 18px;border:1px solid var(--line);border-bottom-color:var(--ink);border-radius:5px 5px 0 0;background:transparent;color:var(--muted);cursor:pointer;font:500 .62rem 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.tabs button.active{background:var(--card);color:var(--ink);border-color:var(--ink);border-bottom-color:var(--card)}.toolbar{padding:15px 0 4px}.toolbar label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.toolbar input{width:100%;padding:12px 14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;outline:none;font-size:.88rem}.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #b07a2a33}.columns,summary{display:grid;grid-template-columns:minmax(0,1fr) 90px 118px;gap:16px}.columns{padding:12px 18px 7px;color:var(--muted);font:500 .56rem 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase}.group{margin:8px 0 20px;box-shadow:0 5px 18px #14233b12}.group-head{display:flex;align-items:baseline;gap:13px;padding:11px 16px 9px;background:var(--soft);border-radius:5px 5px 0 0}.group-head h2{margin:0;font:600 1.42rem 'Cormorant Garamond',serif}.group-head span{color:var(--accent);font:500 .57rem 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.entry{background:var(--card);border-bottom:1px solid var(--line)}.entry:last-child{border-radius:0 0 5px 5px}summary{position:relative;align-items:center;padding:13px 42px 13px 18px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'+';position:absolute;right:18px;top:15px;color:var(--accent);font:500 1.05rem 'IBM Plex Mono',monospace}.entry[open] summary::after{content:'−'}summary:hover{background:#f1f4f8}.title{font:600 1.12rem 'Cormorant Garamond',serif}.title small{display:block;margin-top:3px;color:var(--muted);font:500 .54rem 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase}summary>span:not(.title){font-size:.78rem;color:#3e4b60}.status{color:var(--accent)!important;font-weight:600}.body{padding:4px 140px 18px 18px;border-top:1px dashed var(--line)}.body p{max-width:650px;margin:13px 0 12px;color:#4d5a6c;font-size:.84rem;line-height:1.65}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{padding:4px 7px;background:var(--soft);border-radius:2px;color:#526078;font:500 .53rem 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}.empty{margin-top:10px;padding:46px 20px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:5px}.empty strong{font:600 1.4rem 'Cormorant Garamond',serif}.empty p{margin:6px 0 0;color:var(--muted);font-size:.82rem}footer{display:flex;justify-content:space-between;gap:16px;margin-top:34px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font:500 .55rem 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    /* Prominent navy-and-ivory treatment */
    .masthead{background:var(--ink);color:var(--paper);padding:24px;border:0;border-radius:6px}
    .head-meta{color:#dfbb72}
    .masthead select{color:var(--paper);border-color:var(--paper);background-image:linear-gradient(45deg,transparent 50%,var(--paper) 50%),linear-gradient(135deg,var(--paper) 50%,transparent 50%)}
    .masthead select option{color:var(--ink);background:var(--card)}
    .tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);border-bottom-color:var(--ink)}
    .group-head{background:var(--ink)}
    .group-head h2{color:var(--paper)}
    .group-head span{color:#dfbb72}
    @media(max-width:640px){main{padding:28px 14px 48px}.masthead{align-items:flex-start;flex-direction:column;padding:20px}.head-meta{width:100%;justify-content:space-between}.intro{display:block}.intro p+p{margin-top:7px}.tabs{overflow-x:auto}.tabs button{padding:9px 13px}.columns{display:none}summary{grid-template-columns:minmax(0,1fr) 55px;padding-left:13px}summary .status{display:none}.body{padding:3px 14px 16px}.group-head{padding-left:13px}footer{flex-direction:column}}
  </style>
</head>
<body>
<main><div class="shell">
  <header class="masthead"><div><p class="eyebrow">A personal index</p><h1>The Organized List</h1></div><div class="head-meta"><span id="count"></span><select id="sort" aria-label="Sort entries"><option value="category">Sort: Category</option><option value="title">Sort: Title</option><option value="year">Sort: Newest</option></select></div></header>
  <section class="intro" aria-label="About this list"><p><span>Purpose</span>A flexible home for things worth keeping track of.</p><p><span>Currently</span>Collecting slowly, choosing carefully.</p></section>
  <nav class="tabs" aria-label="List views"><button class="active" data-tab="All">All</button><button data-tab="Collection">Collection</button><button data-tab="Wishlist">Wishlist</button></nav>
  <div class="toolbar"><label for="search">Search the list</label><input id="search" type="search" placeholder="Try a title, category, status, or tag…"></div>
  <div class="columns" aria-hidden="true"><span>Entry</span><span>Year</span><span>Status</span></div>
  <section id="catalog" aria-live="polite"></section>
  <footer><span>The Organized List</span><span>Last updated August 2026</span></footer>
</div></main>
<script>
  // EDIT THIS LIST to replace the sample entries with your own.
  const entries=[
    {title:'The Midnight Archive',category:'Books & Print',type:'Collection',year:'2024',status:'Owned',description:'A beautifully bound reference edition with gilt details and a cloth cover.',tags:['hardcover','favorite']},
    {title:'Field Notes, Volume II',category:'Books & Print',type:'Wishlist',year:'2022',status:'Searching',description:'Looking for the moss-green first printing, preferably in very good condition.',tags:['first edition','priority']},
    {title:'Amber Study',category:'Objects',type:'Collection',year:'1978',status:'Owned',description:'Small hand-thrown ceramic vessel in a warm amber glaze.',tags:['ceramic','vintage']},
    {title:'Brass Desk Calendar',category:'Objects',type:'Wishlist',year:'1960s',status:'Considering',description:'Perpetual calendar with rotating month and date wheels.',tags:['brass','desk']},
    {title:'Night Train',category:'Music & Media',type:'Collection',year:'2019',status:'Owned',description:'Limited translucent pressing with the original lyric booklet.',tags:['vinyl','limited']},
    {title:'Sunday Matinee',category:'Music & Media',type:'Wishlist',year:'2006',status:'Searching',description:'A quiet favorite that has been surprisingly difficult to track down.',tags:['film','priority']},
    {title:'Museum Ticket No. 14',category:'Paper Ephemera',type:'Collection',year:'1998',status:'Archived',description:'Numbered admission ticket from a traveling modern art exhibition.',tags:['ticket','memory']},
    {title:'Coastal Postcard Set',category:'Paper Ephemera',type:'Wishlist',year:'1950s',status:'Considering',description:'A complete set of six illustrated postcards in muted seaside colors.',tags:['postcard','vintage']}
  ];
  let activeTab='All';
  const catalog=document.querySelector('#catalog'),search=document.querySelector('#search'),sort=document.querySelector('#sort'),count=document.querySelector('#count');
  const safe=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function render(){
    const q=search.value.trim().toLowerCase();
    const shown=entries.filter(e=>(activeTab==='All'||e.type===activeTab)&&(!q||[e.title,e.category,e.status,...e.tags].join(' ').toLowerCase().includes(q))).sort((a,b)=>sort.value==='title'?a.title.localeCompare(b.title):sort.value==='year'?b.year.localeCompare(a.year):a.category.localeCompare(b.category)||a.title.localeCompare(b.title));
    count.textContent=String(shown.length).padStart(2,'0')+' entries';
    if(!shown.length){catalog.innerHTML='<div class="empty"><strong>Nothing found.</strong><p>Try a different search or switch lists.</p></div>';return}
    const groups=Object.groupBy?Object.groupBy(shown,e=>e.category):shown.reduce((a,e)=>((a[e.category]??=[]).push(e),a),{});
    catalog.innerHTML=Object.entries(groups).map(([category,items])=>`<div class="group"><div class="group-head"><h2>${safe(category)}</h2><span>${items.length} ${items.length===1?'item':'items'}</span></div>${items.map(e=>`<details class="entry"><summary><span class="title">${safe(e.title)}<small>${safe(e.type)}</small></span><span>${safe(e.year)}</span><span class="status">${safe(e.status)}</span></summary><div class="body"><p>${safe(e.description)}</p><div class="tags">${e.tags.map(t=>`<span>${safe(t)}</span>`).join('')}</div></div></details>`).join('')}</div>`).join('');
  }
  document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{activeTab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));render()}));
  search.addEventListener('input',render);sort.addEventListener('change',render);render();
</script>
</body>
</html>
